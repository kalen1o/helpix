services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: helpix
      POSTGRES_PASSWORD: helpix
      POSTGRES_DB: helpix
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpix -d helpix"]
      interval: 2s
      timeout: 3s
      retries: 30

  tenant-auth:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
    env_file: .env
    environment:
      SERVICE: tenant-auth
      PORT: "4001"
      DATABASE_URL: postgres://helpix:helpix@postgres:5432/helpix
    depends_on:
      postgres:
        condition: service_healthy

  kb-service:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
    env_file: .env
    environment:
      SERVICE: kb-service
      PORT: "4002"
      DATABASE_URL: postgres://helpix:helpix@postgres:5432/helpix
      KB_STORAGE_DIR: /data/kb
    volumes:
      # Same folder `make dev` uses, so documents uploaded in either mode stay readable in both.
      - ./.data/kb:/data/kb
    depends_on:
      postgres:
        condition: service_healthy

  chat-service:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
    env_file: .env
    environment:
      SERVICE: chat-service
      PORT: "4003"
      DATABASE_URL: postgres://helpix:helpix@postgres:5432/helpix
      TENANT_AUTH_URL: http://tenant-auth:4001
      KB_SERVICE_URL: http://kb-service:4002
    depends_on:
      postgres:
        condition: service_healthy
      tenant-auth:
        condition: service_started
      kb-service:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
    env_file: .env
    environment:
      SERVICE: gateway
      PORT: "4000"
      TENANT_AUTH_URL: http://tenant-auth:4001
      KB_SERVICE_URL: http://kb-service:4002
      CHAT_SERVICE_URL: http://chat-service:4003
    ports:
      - "4000:4000"
    depends_on:
      - tenant-auth
      - kb-service
      - chat-service

volumes:
  pgdata: {}
